<div class="venda-container">

  <h2>Registrar Venda</h2>

  <mat-stepper linear>

    <!-- STEP 1 - PRODUTOS -->
    <mat-step [completed]="produtos.length > 0">
      <ng-template matStepLabel>Produtos</ng-template>

      <app-venda-produtos
        [produtosSelecionados]="produtos"
        (produtoAdicionado)="onProdutoAdicionado($event)"
        (produtoRemovido)="onProdutoRemovido($event)">
      </app-venda-produtos>

      <div class="step-actions">
        <button
          mat-raised-button
          color="primary"
          matStepperNext
          [disabled]="produtos.length === 0">
          Ir para pagamento
        </button>
      </div>
    </mat-step>

    <!-- STEP 2 - PAGAMENTO -->
    <mat-step [stepControl]="pagamentoForm">
      <ng-template matStepLabel>Pagamento</ng-template>

      <app-venda-pagamento
        [form]="pagamentoForm"
        [valorTotal]="valorTotal">
      </app-venda-pagamento>

      <div class="step-actions">
        <button mat-button matStepperPrevious>
          Voltar
        </button>

        <button
          mat-raised-button
          color="accent"
          (click)="finalizarVenda()"
          [disabled]="!this.vendaValida">
          Finalizar Venda
        </button>
      </div>
    </mat-step>

  </mat-stepper>

</div>
